<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow"><title>Blog · Admin Salvio Gonçalves</title><style>:root{--i:#faf7f2;--s:#f1ebe2;--b:#eee5d9;--l:#ddd2c3;--t:#2c2723;--m:#756b61;--g:#4e6351;--r:#b3474d;--terra:#b97a5a}*{box-sizing:border-box}body{margin:0;padding:20px 12px;background:var(--s);color:var(--t);font:14px Georgia,serif}.shell{max-width:980px;margin:auto}.card{background:var(--i);border:1px solid var(--l);border-radius:18px;padding:22px;margin-bottom:16px}h1{margin:0 0 5px;color:var(--g);font-size:24px}h2{margin:0 0 14px;color:var(--g);font-size:14px;letter-spacing:.14em;text-transform:uppercase}.muted{color:var(--m);font-size:13px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}button{border:1px solid var(--g);border-radius:999px;padding:10px 16px;background:var(--g);color:var(--i);font:inherit;font-weight:600;cursor:pointer}.outline{background:transparent;color:var(--g)}.danger{background:transparent;border-color:var(--r);color:var(--r)}input,textarea{width:100%;border:1px solid var(--l);border-radius:12px;background:#fff;color:var(--t);padding:12px 14px;font:inherit}textarea{min-height:330px;resize:vertical}.grid{display:grid;gap:10px}.posts{display:grid;gap:10px;margin-top:14px}.post{display:flex;align-items:center;gap:12px;border:1px solid var(--l);background:var(--b);border-radius:14px;padding:13px 15px;cursor:pointer}.post:hover{border-color:var(--g)}.post .info{flex:1;min-width:0}.post strong{display:block;color:var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.post small{display:block;margin-top:4px;color:var(--m)}.msg{padding:10px 12px;border-radius:9px;background:var(--s);color:var(--m);font-size:13px}.err{background:#f3e3e4;color:var(--r)}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.login{max-width:400px;margin:12vh auto}.like{color:var(--terra);font-weight:700;white-space:nowrap}@media(max-width:600px){body{padding:10px 7px}.card{padding:16px}.post{padding:11px}.actions button{flex:1 1 40%}}</style></head><body><main class="shell"><section id="login" class="card login"><h1>Blog · Admin</h1><p class="muted">Entre com a senha do painel para gerenciar os posts.</p><form id="login-form" class="grid"><input id="password" type="password" placeholder="Senha do admin" required><button>Entrar</button></form><p id="login-msg" class="msg hidden"></p></section><div id="app" class="hidden"><section class="card"><div class="top"><div><h1>Posts do blog</h1><p class="muted">Listagem e edição segura dos artigos</p></div><div class="actions"><button id="back" class="outline">Voltar ao admin</button><button id="new">+ Novo post</button></div></div><div class="row" style="margin-top:14px"><input id="search" placeholder="Buscar por título ou tag..."><button id="reload" class="outline">Atualizar</button></div><div id="status" class="msg" style="margin-top:12px">Carregando…</div><div id="posts" class="posts"></div></section><section id="editor" class="card hidden"><div class="top"><div><h2 id="editor-title">Novo post</h2><p id="editor-file" class="muted"></p></div><button id="close" class="outline">Voltar à lista</button></div><div class="grid" style="margin-top:14px"><input id="title" placeholder="Título do post"><input id="description" placeholder="Descrição curta"><div class="row"><input id="date" type="date"><input id="tags" placeholder="Tags separadas por vírgula"></div><textarea id="body" placeholder="Escreva o conteúdo em Markdown..."></textarea></div><div class="actions"><button id="save">Salvar post</button><button id="delete" class="danger hidden">Apagar post</button><span id="save-msg" class="msg hidden"></span></div></section></div></main><script>const API="/.netlify/functions/posts",ADMIN="/.netlify/functions/admin";let token=sessionStorage.getItem("nl-admin-token")||"",posts=[],currentFile=null;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));function msg(text,error=false){$("status").textContent=text;$("status").className="msg"+(error?" err":"")}$('back').onclick=()=>location.href="/admin/";$('close').onclick=closeEditor;$('reload').onclick=load;$('search').oninput=render;$('new').onclick=()=>openEditor();$('login-form').onsubmit=async e=>{e.preventDefault();const r=await fetch(ADMIN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",password:$("password").value})}).then(x=>x.json());if(!r.ok){$("login-msg").textContent=r.error||"Senha incorreta";$("login-msg").className="msg err";return}token=r.token;sessionStorage.setItem("nl-admin-token",token);start()};function start(){if(!token)return;$("login").classList.add("hidden");$("app").classList.remove("hidden");load()}async function call(body){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token})}).then(r=>r.json())}async function load(){msg("Carregando…");const r=await call({action:"list"});if(!r.ok){msg(r.error||"Não foi possível carregar os posts.",true);return}posts=r.posts;render();msg(`${posts.length} post${posts.length===1?"":"s"} carregado${posts.length===1?"":"s"}.`)}function render(){const q=$("search").value.toLowerCase().trim(),xs=posts.filter(p=>!q||[p.title,p.tags.join(" ")].join(" ").toLowerCase().includes(q));$("posts").innerHTML=xs.length?xs.map(p=>`<article class="post" data-file="${esc(p.file)}"><div class="info"><strong>${esc(p.title)}</strong><small>${esc(p.file)} · ${esc((p.tags||[]).join(", "))}</small></div>${p.draft?'<span class="muted">Rascunho</span>':""}</article>`).join(""):"<p class=\"muted\">Nenhum post encontrado.</p>";document.querySelectorAll(".post").forEach(e=>e.onclick=()=>openEditor(e.dataset.file))}async function openEditor(file){currentFile=file||null;$("editor").classList.remove("hidden");$("posts").parentElement.classList.add("hidden");$("editor-title").textContent=file?"Editar post":"Novo post";$("editor-file").textContent=file||"";$("delete").classList.toggle("hidden",!file);if(!file){$("title").value="";$("description").value="";$("date").value=new Date().toISOString().slice(0,10);$("tags").value="";$("body").value="";return}const r=await call({action:"get",file});if(!r.ok){showSave(r.error||"Erro ao abrir post",true);return}const p=r.post;$("title").value=p.title||"";$("description").value=p.description||"";$("date").value=(p.pubDatetime||"").slice(0,10);$("tags").value=(p.tags||[]).join(", ");$("body").value=p.body||""}function closeEditor(){$("editor").classList.add("hidden");$("posts").parentElement.classList.remove("hidden");currentFile=null}function showSave(t,e=false){const x=$("save-msg");x.textContent=t;x.className="msg"+(e?" err":"");x.classList.remove("hidden")}$("save").onclick=async()=>{const p={title:$("title").value.trim(),description:$("description").value.trim(),pubDatetime:$("date").value,tags:$("tags").value,body:$("body").value,draft:false,featured:false};if(!p.title||!p.body){showSave("Título e conteúdo são obrigatórios.",true);return}const b=$("save");b.disabled=true;const r=await call({action:"save",file:currentFile,post:p});b.disabled=false;if(!r.ok){showSave(r.error||"Falha ao salvar",true);return}showSave("Post salvo. O blog atualiza após o deploy.");currentFile=r.file;$("editor-file").textContent=r.file;$("delete").classList.remove("hidden");await load()};$("delete").onclick=async()=>{if(!currentFile||!confirm("Apagar este post?"))return;const r=await call({action:"delete",file:currentFile});if(!r.ok){showSave(r.error||"Falha ao apagar",true);return}closeEditor();load()};if(token)start();</script></body></html>
