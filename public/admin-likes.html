<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Likes · Admin Salvio Gonçalves</title>
  <style>
    :root{--i:#faf7f2;--s:#f1ebe2;--box:#eee5d9;--l:#ddd2c3;--t:#2c2723;--m:#756b61;--g:#4e6351;--terra:#b97a5a;--r:#b3474d}
    *{box-sizing:border-box}body{margin:0;padding:26px 14px;background:var(--s);color:var(--t);font-family:Georgia,serif}.shell{max-width:980px;margin:auto}.card{background:var(--i);border:1px solid var(--l);border-radius:18px;padding:24px;margin-bottom:18px}h1{margin:0 0 5px;color:var(--g);font-size:24px}h2{margin:0 0 14px;color:var(--g);font-size:14px;letter-spacing:.14em;text-transform:uppercase}.sub,.muted{color:var(--m);font-size:13px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--g);border-radius:999px;padding:10px 16px;background:var(--g);color:var(--i);font:inherit;font-size:13px;font-weight:600;cursor:pointer}.outline{background:transparent;color:var(--g)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--s);border-radius:13px;padding:14px;text-align:center}.stat b{display:block;color:var(--g);font-size:25px}.stat span{font-size:12px;color:var(--m)}.list{display:grid;gap:10px}.post{display:flex;align-items:center;gap:14px;border:1px solid var(--l);background:var(--box);border-radius:14px;padding:14px 16px}.rank{width:28px;color:var(--terra);font-size:18px;font-weight:700;text-align:center}.info{min-width:0;flex:1}.title{color:var(--g);font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file{margin-top:4px;color:var(--m);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.likes{color:var(--terra);font-size:15px;font-weight:700;white-space:nowrap}.message{padding:12px;border-radius:10px;background:var(--s);color:var(--m);font-size:13px}.error{background:#f3e3e4;color:var(--r)}@media(max-width:600px){body{padding:12px 8px}.card{padding:16px}.top{display:block}.top .actions{margin-top:14px}.stats{gap:6px}.stat{padding:10px 5px}.stat b{font-size:20px}.stat span{font-size:10px}.post{gap:9px;padding:12px}.title{font-size:13px}.likes{font-size:13px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="top"><div><h1>Engajamento dos posts</h1><p class="sub">Métricas de likes dos artigos publicados</p></div><div class="actions"><button class="outline" id="back">Voltar ao admin</button><button id="refresh">Atualizar</button></div></div>
    </section>
    <section class="card"><div class="stats"><div class="stat"><b id="total">–</b><span>likes no total</span></div><div class="stat"><b id="top">–</b><span>maior contagem</span></div><div class="stat"><b id="avg">–</b><span>média por post</span></div></div></section>
    <section class="card"><h2>Posts mais curtidos</h2><div id="status" class="message">Carregando…</div><div id="list" class="list"></div></section>
  </main>
  <script>
    const ADMIN="/.netlify/functions/posts", LIKES="/.netlify/functions/likes";
    const $=id=>document.getElementById(id), token=sessionStorage.getItem("nl-admin-token")||"";
    $("back").onclick=()=>location.href="/admin/";
    $("refresh").onclick=load;
    async function load(){
      if(!token){$("status").className="message error";$("status").textContent="Sua sessão expirou. Entre novamente no admin.";return}
      $("refresh").disabled=true;$("status").className="message";$("status").textContent="Carregando…";
      try{
        const response=await fetch(ADMIN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"list",token})});
        const data=await response.json();
        if(!data.ok)throw new Error(data.error||"Não foi possível carregar os posts.");
        const posts=await Promise.all(data.posts.map(async post=>{try{const r=await fetch(`${LIKES}?slug=${encodeURIComponent(post.file.replace(/\.md$/,""))}`);const d=await r.json();return {...post,likes:Number(d.count)||0}}catch{return {...post,likes:0}}}));
        posts.sort((a,b)=>b.likes-a.likes||String(b.pubDatetime).localeCompare(String(a.pubDatetime)));
        const counts=posts.map(p=>p.likes),total=counts.reduce((a,b)=>a+b,0),top=counts.length?Math.max(...counts):0;
        $("total").textContent=total;$("top").textContent=top;$("avg").textContent=counts.length?(total/counts.length).toFixed(1).replace(".",","):"0";
        $("list").innerHTML=posts.length?posts.map((p,i)=>`<article class="post"><span class="rank">${i+1}</span><div class="info"><div class="title">${escapeHtml(p.title)}</div><div class="file">${escapeHtml(p.file)}</div></div><strong class="likes">♥ ${p.likes}</strong></article>`).join(""):"<p class=\"muted\">Nenhum post encontrado.</p>";
        $("status").textContent=`${posts.length} post${posts.length===1?"":"s"} analisado${posts.length===1?"":"s"}.`;
      }catch(error){$("status").className="message error";$("status").textContent=error.message||"Erro ao carregar métricas."}
      finally{$("refresh").disabled=false}
    }
    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
    load();
  </script>
</body>
</html>
