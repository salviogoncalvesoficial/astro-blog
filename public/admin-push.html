<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Notificações do Inbox · Admin</title><style>:root{--bg:#f1ebe2;--card:#faf7f2;--line:#ddd2c3;--text:#2c2723;--muted:#756b61;--green:#4e6351;--terra:#b97a5a}*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:var(--bg);color:var(--text);font-family:Georgia,serif}.card{max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}h1{margin:0 0 6px;color:var(--green);font-size:25px}.sub{color:var(--muted);font-size:14px;line-height:1.55}.status{display:flex;align-items:center;gap:9px;margin:22px 0 16px;color:var(--muted);font-size:14px}.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--green);box-shadow:0 0 0 5px #4e635122}.dot.err{background:#b3474d}.actions{display:flex;gap:9px;flex-wrap:wrap}button{border:1px solid var(--green);background:var(--green);color:#fff;padding:11px 16px;border-radius:999px;font:600 14px Georgia;cursor:pointer}button.outline{background:transparent;color:var(--green)}button.danger{background:transparent;border-color:#b3474d;color:#b3474d}button:disabled{opacity:.5;cursor:not-allowed}.msg{display:none;margin-top:16px;padding:11px 14px;border-radius:10px;font-size:13px}.msg.show{display:block;background:#e5efe6;color:var(--green)}.msg.err{display:block;background:#f3e3e4;color:#b3474d}.back{display:inline-block;margin-top:22px;color:var(--green);font-size:14px;text-decoration:none}</style></head><body><main class="card"><h1>Notificações do Inbox</h1><p class="sub">Receba um alerta neste navegador quando chegar um novo e-mail em contato@salviogoncalves.com.br.</p><div class="status"><span id="dot" class="dot"></span><span id="status">Verificando disponibilidade…</span></div><div class="actions"><button id="enable">Ativar notificações</button><button id="test" class="outline" disabled>Testar notificação</button><button id="disable" class="danger" disabled>Desativar neste dispositivo</button></div><p id="msg" class="msg"></p><a class="back" href="/admin/">← Voltar ao painel</a></main><script>const PUSH="/.netlify/functions/push",token=sessionStorage.getItem("nl-admin-token")||"",$=id=>document.getElementById(id);let sub=null;function say(t,err=false){const e=$("msg");e.textContent=t;e.className="msg show"+(err?" err":"");setTimeout(()=>e.className="msg",6000)}function state(t,c=""){$("status").textContent=t;$("dot").className="dot "+c}async function call(body){return fetch(PUSH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token})}).then(r=>r.json())}function bytes(k){const p="=".repeat((4-k.length%4)%4),r=atob((k+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(x=>x.charCodeAt(0)))}async function refresh(){if(!token)return state("Faça login no /admin/ primeiro.","err");if(!("serviceWorker"in navigator)||!("PushManager"in window))return state("Este navegador não oferece Web Push.","err");if(Notification.permission==="denied")return state("Notificações bloqueadas no navegador.","err");try{const reg=await navigator.serviceWorker.register("/push-sw.js");sub=await reg.pushManager.getSubscription();if(sub){state("Notificações ativas neste dispositivo.","on");$("enable").disabled=true;$("enable").textContent="Ativas";$("test").disabled=false;$("disable").disabled=false}else state("Notificações ainda não ativadas.")}catch(e){state("Não foi possível preparar as notificações.","err");say(e.message,true)}}async function enable(){try{$("enable").disabled=true;$("enable").textContent="Ativando…";const k=await call({action:"public-key"});if(!k.ok)throw Error(k.error);if(await Notification.requestPermission()!=="granted")throw Error("Permissão não concedida");const reg=await navigator.serviceWorker.ready;sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes(k.publicKey)});const r=await call({action:"subscribe",subscription:sub.toJSON()});if(!r.ok)throw Error(r.error);say("Notificações ativadas!");refresh()}catch(e){$("enable").disabled=false;$("enable").textContent="Ativar notificações";state(e.message,"err");say(e.message,true)}}async function test(){const r=await call({action:"test"});say(r.ok?"Notificação enviada!":r.error||"Falha no teste",!r.ok)}async function disable(){if(!sub)return;const r=await call({action:"unsubscribe",subscription:sub.toJSON()});await sub.unsubscribe();sub=null;say(r.ok?"Notificações desativadas.":r.error||"Falha",!r.ok);refresh()}$("enable").onclick=enable;$("test").onclick=test;$("disable").onclick=disable;refresh();</script></body></html>
